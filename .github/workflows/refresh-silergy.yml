name: Refresh Silergy Quarterly (MOPS)

# Targeted refresh for Silergy (6415) on the TWSE disclosure dates. The daily job
# that covers it alongside the US filers is refresh-quarterly.yml.

on:
  workflow_dispatch:
  schedule:
    # Silergy 季报披露后自动刷新（台北时间 09:00 = UTC 01:00）
    - cron: '0 1 15 5 *'   # Q1 季报：5 月 15 日
    - cron: '0 1 15 8 *'   # Q2 季报：8 月 15 日
    - cron: '0 1 15 11 *'  # Q3 季报：11 月 15 日
    - cron: '0 1 31 3 *'   # Q4/年报：3 月 31 日

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements_cloudrun.txt

      - name: Install dependencies
        run: pip install -r requirements_cloudrun.txt

      - name: Fetch MOPS quarterly
        run: python fetch_silergy_to_json.py

      - name: Validate data
        run: python validate_data.py || true

      - name: Commit updated data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes — MOPS returned nothing new."
          else
            git commit -m "data: refresh Silergy quarterly $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying in ${i}0s..."
              sleep $((i * 10))
            done
          fi
