name: Refresh Silergy Quarterly (TWSE/TPEx OpenAPI)

# Targeted refresh for Silergy (6415). The daily job that covers it alongside
# the US filers is refresh-quarterly.yml — and since the open-data tables are
# current-period snapshots, that daily run is what accumulates the months a
# quarter is summed from. This workflow is for on-demand runs and diagnosis.

on:
  workflow_dispatch:
    inputs:
      debug:
        description: "Diagnostic run — verbose schema logs, nothing committed"
        type: boolean
        default: false
  schedule:
    # Taiwanese monthly revenue is published by the 10th; run once it has landed.
    - cron: '0 1 12 * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements_cloudrun.txt

      - name: Install dependencies
        run: pip install -r requirements_cloudrun.txt

      # The fetcher discovers its endpoints from each platform's swagger spec and
      # logs the record and field names it matched, so a schema change surfaces
      # here rather than as a silent zero.
      - name: Fetch from TWSE/TPEx OpenAPI
        run: |
          ARGS=""
          [ "${{ github.event.inputs.debug }}" = "true" ] && ARGS="--debug"
          python fetch_silergy_to_json.py $ARGS

      - name: Show what landed
        run: |
          python - <<'PY'
          import json
          c = json.load(open("data.json"))["Silergy"]
          rev, ni = c.get("revenue", {}), c.get("net_income", {})
          print("currency        :", c.get("currency"))
          print("revenue months  :", {k: v for k, v in sorted(rev.items()) if "M" in k} or "NONE")
          print("revenue quarters:", {k: v for k, v in sorted(rev.items()) if "Q" in k} or "NONE")
          print("NI cumulative   :", {k: v for k, v in sorted(ni.items()) if "C" in k} or "NONE")
          print("NI quarters     :", {k: v for k, v in sorted(ni.items()) if "Q" in k} or "NONE")
          PY

      - name: Validate data
        run: python validate_data.py || true

      - name: Commit updated data.json
        if: github.event.inputs.debug != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes — nothing new from the open-data snapshot."
          else
            git commit -m "data: refresh Silergy quarterly $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying in ${i}0s..."
              sleep $((i * 10))
            done
          fi
