name: Refresh Silergy Quarterly (MOPS)

on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloud Run /refresh
        run: |
          curl -f -s -X POST \
            "https://analog-dashboard-460989091461.asia-east1.run.app/refresh" \
            -H "Authorization: Bearer ${{ secrets.REFRESH_SECRET }}" \
            | python3 -m json.tool
