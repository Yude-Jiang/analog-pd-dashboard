name: Refresh Silergy Quarterly (MOPS)

on:
  workflow_dispatch:
  schedule:
    # Silergy 季报披露后自动刷新（台北时间 09:00 = UTC 01:00）
    - cron: '0 1 15 5 *'   # Q1 季报：5 月 15 日
    - cron: '0 1 15 8 *'   # Q2 季报：8 月 15 日
    - cron: '0 1 15 11 *'  # Q3 季报：11 月 15 日
    - cron: '0 1 31 3 *'   # Q4/年报：3 月 31 日

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloud Run /refresh
        run: |
          HTTP_CODE=$(curl -s -o /tmp/body.json -w "%{http_code}" -X POST \
            "https://analog-dashboard-460989091461.asia-east1.run.app/refresh" \
            -H "Authorization: Bearer ${{ secrets.REFRESH_SECRET }}")
          echo "HTTP 状态码: $HTTP_CODE"
          echo "--- 响应内容 ---"
          python3 -m json.tool /tmp/body.json 2>/dev/null || cat /tmp/body.json
          [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ] || exit 1
