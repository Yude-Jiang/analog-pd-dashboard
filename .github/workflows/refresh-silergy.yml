name: Refresh Silergy Quarterly (MOPS)

# Targeted refresh for Silergy (6415) on the TWSE disclosure dates. The daily job
# that covers it alongside the US filers is refresh-quarterly.yml.

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Fiscal years (space-separated, e.g. 2025 2026). Empty = auto."
        required: false
        default: ""
      debug:
        description: "Diagnostic run — verbose MOPS logs, nothing committed"
        type: boolean
        default: false
  schedule:
    # Silergy 季报披露后自动刷新（台北时间 09:00 = UTC 01:00）
    - cron: '0 1 15 5 *'   # Q1 季报：5 月 15 日
    - cron: '0 1 15 8 *'   # Q2 季报：8 月 15 日
    - cron: '0 1 15 11 *'  # Q3 季报：11 月 15 日
    - cron: '0 1 31 3 *'   # Q4/年报：3 月 31 日

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements_cloudrun.txt

      - name: Install dependencies
        run: pip install -r requirements_cloudrun.txt

      # MOPS answers Actions runners with its anti-bot page ("FOR SECURITY
      # REASONS, THIS PAGE CAN NOT BE ACCESSED"), so scraping it from CI is a
      # dead end regardless of endpoint. Probe the alternatives before writing
      # code against any of them, and let the services list their own endpoints
      # rather than guessing paths. Silergy may be TWSE- or TPEx-listed, so
      # check both and confirm 6415 actually appears in the data.
      - name: Probe TWSE / TPEx endpoints
        if: github.event.inputs.debug == 'true'
        continue-on-error: true
        run: |
          python - <<'PY'
          import requests, urllib3, json
          urllib3.disable_warnings()
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
                "Accept": "*/*", "Accept-Language": "zh-TW,zh;q=0.9,en;q=0.8"}
          CODE = "6415"

          def get(url, session=None, **kw):
              c = session or requests
              return c.request(kw.pop("method", "GET"), url, timeout=30,
                               headers=UA, verify=False, **kw)

          def show(label, url, **kw):
              try:
                  r = get(url, **kw)
                  blocked = "SECURITY REASONS" in r.text
                  head = " ".join(r.text[:200].split())
                  print(f"{label:32s} HTTP {r.status_code} {len(r.text):>9d}B "
                        f"{'[BLOCKED] ' if blocked else ''}{head[:100]}")
                  return None if blocked else r
              except Exception as e:
                  print(f"{label:32s} ERROR {type(e).__name__}: {str(e)[:80]}")
                  return None

          print("=== 1. MOPS (baseline: expect blocked) ===")
          show("MOPS page GET", "https://mops.twse.com.tw/mops/web/t21sc03")
          sess = requests.Session()
          show("MOPS landing (session)", "https://mops.twse.com.tw/mops/web/index", session=sess)
          show("MOPS ajax after session", "https://mops.twse.com.tw/mops/web/ajax_t21sc03",
               session=sess, method="POST",
               data={"encodeURIComponent":"1","step":"1","firstin":"1","off":"1",
                     "queryName":"co_id","inpuType":"co_id","TYPEK":"all","isnew":"false",
                     "co_id":CODE,"year":"115","season":"00"})

          print("\n=== 2. TWSE OpenAPI ===")
          spec = show("swagger spec", "https://openapi.twse.com.tw/v1/swagger.json")
          paths = []
          if spec is not None:
              try:
                  paths = sorted((spec.json().get("paths") or {}).keys())
                  print(f"  {len(paths)} endpoints published")
                  kw = ("revenue", "t187ap05", "t187ap06", "ifrs", "financ", "income")
                  hits = [p for p in paths if any(k in p.lower() for k in kw)]
                  print("  revenue/financial candidates:")
                  for p_ in hits: print("    ", p_)
              except Exception as e:
                  print("  spec parse failed:", e)

          print("\n=== 3. Does 6415 appear? (TWSE candidates) ===")
          for p_ in [p for p in paths if any(k in p.lower()
                     for k in ("revenue","t187ap05","t187ap06"))][:6]:
              r = show(f"  {p_[:28]}", "https://openapi.twse.com.tw" + p_)
              if r is not None:
                  print(f"      contains {CODE}: {CODE in r.text}")

          print("\n=== 4. TPEx (in case 6415 is OTC-listed) ===")
          show("TPEx openapi index", "https://www.tpex.org.tw/openapi/swagger.json")
          PY

      - name: Fetch MOPS quarterly
        run: |
          ARGS=""
          [ -n "${{ github.event.inputs.years }}" ] && ARGS="--years ${{ github.event.inputs.years }}"
          [ "${{ github.event.inputs.debug }}" = "true" ] && ARGS="$ARGS --debug"
          python fetch_silergy_to_json.py $ARGS

      # MOPS endpoints have moved before; show what actually landed.
      - name: Show extracted quarters
        run: |
          python - <<'PY'
          import json
          c = json.load(open("data.json"))["Silergy"]
          rev = c.get("revenue", {}); ni = c.get("net_income", {})
          print("currency:", c.get("currency"))
          print("revenue quarters :", {k: v for k, v in sorted(rev.items()) if "Q" in k} or "NONE")
          print("revenue months   :", {k: v for k, v in sorted(rev.items()) if "M" in k} or "NONE")
          print("NI quarters      :", {k: v for k, v in sorted(ni.items()) if "Q" in k} or "NONE")
          PY

      - name: Validate data
        run: python validate_data.py || true

      - name: Commit updated data.json
        if: github.event.inputs.debug != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes — MOPS returned nothing new."
          else
            git commit -m "data: refresh Silergy quarterly $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying in ${i}0s..."
              sleep $((i * 10))
            done
          fi
