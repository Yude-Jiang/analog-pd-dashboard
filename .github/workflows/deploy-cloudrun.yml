name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT:  st-china-ai-force
  REGION:   asia-east1
  SERVICE:  analog-dashboard
  IMAGE:    asia-east1-docker.pkg.dev/st-china-ai-force/cloud-run-source-deploy/analog-dashboard

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          TAG="${{ env.IMAGE }}:${{ github.sha }}"
          docker build -t "$TAG" -t "${{ env.IMAGE }}:latest" .
          docker push "$TAG"
          docker push "${{ env.IMAGE }}:latest"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image "${{ env.IMAGE }}:${{ github.sha }}" \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT }} \
            --allow-unauthenticated \
            --memory 1Gi --cpu 1 --timeout 300 \
            --set-env-vars "GCS_BUCKET=st-china-ai-force-dashboard,REFRESH_SECRET=${{ secrets.REFRESH_SECRET }}"

      - name: Upload latest JSON data to GCS
        run: |
          gcloud storage cp data.json yjbb_annual.json yjbb_quarterly.json profiles_xq.json \
            gs://st-china-ai-force-dashboard/
