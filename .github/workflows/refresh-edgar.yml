name: Refresh EDGAR Quarterly (MPWR / NVTS)

# Targeted manual refresh for the two US filers. The daily job that covers them
# alongside Silergy is refresh-quarterly.yml; this one exists to re-pull a single
# ticker after a restatement without waiting for the schedule.

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers to refresh (space-separated, e.g. NVTS). Empty = all."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements_cloudrun.txt

      - name: Install dependencies
        run: pip install -r requirements_cloudrun.txt

      - name: Fetch EDGAR quarterly
        run: |
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            python fetch_edgar_to_json.py --tickers ${{ github.event.inputs.tickers }}
          else
            python fetch_edgar_to_json.py
          fi

      - name: Validate data
        run: python validate_data.py || true

      - name: Commit updated data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes — EDGAR returned nothing new."
          else
            git commit -m "data: refresh EDGAR quarterly $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying in ${i}0s..."
              sleep $((i * 10))
            done
          fi
