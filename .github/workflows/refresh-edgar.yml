name: Refresh EDGAR Quarterly (MPWR / NVTS)

# Targeted manual refresh for the two US filers. The daily job that covers them
# alongside Silergy is refresh-quarterly.yml; this one exists to re-pull a single
# ticker after a restatement without waiting for the schedule.

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers to refresh (space-separated, e.g. NVTS). Empty = all."
        required: false
        default: ""
      debug:
        description: "Diagnostic run — verbose EDGAR logs, nothing committed"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements_cloudrun.txt

      - name: Install dependencies
        run: pip install -r requirements_cloudrun.txt

      - name: Fetch EDGAR quarterly
        run: |
          ARGS=""
          [ -n "${{ github.event.inputs.tickers }}" ] && ARGS="--tickers ${{ github.event.inputs.tickers }}"
          [ "${{ github.event.inputs.debug }}" = "true" ] && ARGS="$ARGS --debug"
          python fetch_edgar_to_json.py $ARGS

      # What actually landed, so a wrong-magnitude extraction is obvious in the log.
      - name: Show extracted quarters
        run: |
          python - <<'PY'
          import json
          d = json.load(open("data.json"))
          for name, c in d.items():
              if c.get("code") in ("MPWR", "NVTS"):
                  rev = c.get("revenue", {})
                  yrs = {k: v for k, v in rev.items() if k.isdigit()}
                  qs  = {k: v for k, v in sorted(rev.items()) if "Q" in k}
                  print(f"\n{name} ({c['code']}) — {c.get('currency')}")
                  print(f"  annual  : {yrs}")
                  print(f"  quarters: {qs}")
                  for y in sorted(yrs):
                      sub = [v for k, v in qs.items() if k.startswith(y)]
                      if sub:
                          print(f"  {y}: sum(Q)={sum(sub):.3f} vs annual={yrs[y]:.3f}"
                                f"  ratio={yrs[y]/sum(sub):.1f}x" if sum(sub) else "")
          PY

      - name: Validate data
        run: python validate_data.py || true

      - name: Commit updated data.json
        if: github.event.inputs.debug != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes — EDGAR returned nothing new."
          else
            git commit -m "data: refresh EDGAR quarterly $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying in ${i}0s..."
              sleep $((i * 10))
            done
          fi
