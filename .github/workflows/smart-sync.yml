name: Smart Sync (Disclosure-Gated)

on:
  schedule:
    # 09:00 Beijing time (UTC+8) on weekdays = 01:00 UTC
    - cron: "0 1 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Force full sync without disclosure calendar check"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements_cloudrun.txt

      - name: Install dependencies
        run: pip install -r requirements_cloudrun.txt

      - name: Run smart sync
        run: |
          # smart_sync.py exit codes: 0 = no disclosures due, 1 = sync ran,
          # >=2 = real failure. Only >=2 should fail the job.
          set +e
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python smart_sync.py --force
          else
            python smart_sync.py --window 2
          fi
          rc=$?
          set -e
          echo "smart_sync.py exit code: $rc"
          if [ "$rc" -ge 2 ]; then exit "$rc"; fi

      - name: Commit updated JSON files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add yjbb_annual.json yjbb_quarterly.json data.json
          if git diff --cached --quiet; then
            echo "No changes — no new disclosures today."
          else
            git commit -m "data: smart-sync $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying in ${i}0s..."
              sleep $((i * 10))
            done
          fi
