name: Refresh YJBB Annual Data

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years to refresh (space-separated, e.g. 2025 or 2024 2025)"
        required: false
        default: ""   # empty = auto-detect current year

  schedule:
    # 年报季（3-5月）+ 季报季（8月Q2、10-11月Q3）每个工作日 10:00 北京时间
    - cron: "0 2 * 3,4,5,8,10,11 1-5"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements_cloudrun.txt

      - name: Install dependencies
        run: pip install -r requirements_cloudrun.txt

      - name: Resolve target years
        id: years
        run: |
          if [ -n "${{ github.event.inputs.years }}" ]; then
            echo "years=${{ github.event.inputs.years }}" >> $GITHUB_OUTPUT
          else
            # Scheduled run: use current year (e.g. 2026)
            echo "years=$(date +%Y)" >> $GITHUB_OUTPUT
          fi

      - name: Fetch annual YJBB data
        run: python fetch_yjbb_annual.py --years ${{ steps.years.outputs.years }}

      - name: Fetch quarterly YJBB data
        run: python fetch_yjbb_quarterly.py
        continue-on-error: true

      - name: Validate data
        run: python validate_data.py || true

      - name: Commit updated JSON files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add yjbb_annual.json yjbb_quarterly.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: refresh YJBB annual/quarterly (${{ steps.years.outputs.years }})"
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying in ${i}0s..."
              sleep $((i * 10))
            done
          fi
