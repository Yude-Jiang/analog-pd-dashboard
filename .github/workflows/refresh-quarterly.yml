name: Refresh Quarterly Data (MPWR / NVTS / Silergy)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1-5"   # 09:00 Beijing weekdays

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloud Run /refresh
        run: |
          curl -f -s -X POST \
            "https://analog-dashboard-460989091461.asia-east1.run.app/refresh" \
            -H "Authorization: Bearer ${{ secrets.REFRESH_SECRET }}" \
            | python3 -m json.tool
